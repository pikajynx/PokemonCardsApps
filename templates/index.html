<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pokémon Card Price Checker</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>🃏 Pokémon Card Prices</h1>
            <p class="subtitle">TCGPlayer · eBay Sold · Whatnot</p>
        </header>

        <form action="/search" method="get" class="search-form">
            <input
                type="text"
                name="q"
                placeholder="Charizard ex 223/165"
                autocomplete="off"
                autofocus
                required
            >
            <button type="submit">Search</button>
        </form>

        <div class="hint">
            <p>Try: <strong>Charizard ex</strong>, <strong>Pikachu VMAX</strong>, <strong>Mewtwo ex 225</strong></p>
        </div>
    </div>
</body>
</html>
