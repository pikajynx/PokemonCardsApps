<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pokémon Card Price Checker</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>🃏 Pokémon Card Prices</h1>
            <p class="subtitle">TCGPlayer · eBay Sold · Whatnot</p>
        </header>

        <form action="/search" method="get" class="search-form" id="searchform">
            <input
                type="text"
                name="q"
                placeholder="Charizard ex 223/165"
                autocomplete="off"
                autofocus
                required
            >
            <button type="submit">Search</button>
        </form>

        <div class="grade-filter">
            <span class="grade-label">Grade:</span>
            <label><input type="radio" name="grade" value="" form="searchform" checked> All</label>
            <label><input type="radio" name="grade" value="PSA 10" form="searchform"> PSA 10</label>
            <label><input type="radio" name="grade" value="PSA 9" form="searchform"> PSA 9</label>
            <label><input type="radio" name="grade" value="BGS 10" form="searchform"> BGS 10</label>
            <label><input type="radio" name="grade" value="CGC 10" form="searchform"> CGC 10</label>
        </div>

        <div class="date-filter">
            <span class="date-label">Sold After:</span>
            <label><input type="radio" name="sold_after" value="" form="searchform" checked> Any Time</label>
            <label><input type="radio" name="sold_after" value="7d" form="searchform"> 7 Days</label>
            <label><input type="radio" name="sold_after" value="30d" form="searchform"> 30 Days</label>
            <label><input type="radio" name="sold_after" value="90d" form="searchform"> 90 Days</label>
        </div>

        <div class="hint">
            <p>Try: <strong>Charizard ex</strong>, <strong>Pikachu VMAX</strong>, <strong>Mewtwo ex 225</strong></p>
            <p>For graded cards: search the card name, then select a grade above</p>
        </div>
    </div>
</body>
</html>
