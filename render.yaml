services:
  - type: web
    name: poke-price-checker
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: TCGPLAYER_API_KEY
        sync: false
      - key: COMPSNIPER_API_KEY
        sync: false
      - key: APIFY_API_KEY
        sync: false
